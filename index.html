<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Enable JS-gated motion before first paint. No-JS/crawlers keep fully visible content. -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14223d" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Search console verifications: add real codes via env or VITE replace before publishing.
         Placeholders intentionally not shipped. -->

    <!-- Default OpenGraph / Twitter card. The prerender (scripts/prerender.mjs)
         rewrites og:type, og:image and its size and alt, and twitter:image per
         route; use-page-meta.ts does the same after hydration. The image values
         mirror DEFAULT_OG_IMAGE* in src/lib/brand.ts. -->
    <meta property="og:site_name" content="KW Economics" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kweconomics.com/images/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KW Economics forensic economics and economic damages experts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kweconomics.com/images/og-default.jpg" />

    <!-- Robots directives -->
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />

    <!-- LLM/AI crawler discovery -->
    <link rel="alternate" type="text/plain" title="LLMs.txt" href="/llms.txt" />
    <link rel="alternate" type="text/plain" title="LLMs Full" href="/llms-full.txt" />

    <title>KW Economics | Forensic Economics and Economic Damages Experts</title>
    <meta
      name="description"
      content="Forensic economists, forensic accountants, and business valuation experts for plaintiff and defense counsel nationwide."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
